<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ramptium (RMP)</title>

  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <link rel="stylesheet" href="style.css"/>
</head>

<body>

<div class="container">

  <!-- Header -->
  <div class="header">
    <img src="https://via.placeholder.com/80" class="logo"/>
    <h1>Ramptium</h1>
    <p class="symbol">RMP</p>
  </div>

  <!-- Balance Card -->
  <div class="card">
    <p>Balance</p>
    <h2 id="balance">0 RMP</h2>
  </div>

  <!-- Wallet Info -->
  <div class="card">
    <p>User</p>
    <p id="username">Loading...</p>
  </div>

  <!-- Actions -->
  <div class="card">
    <button onclick="sendToken()">Send</button>
    <button onclick="receiveToken()">Receive</button>
  </div>

  <!-- Stats -->
  <div class="card stats">
    <div>
      <p>Price</p>
      <h3>$0.001</h3>
    </div>
    <div>
      <p>Holders</p>
      <h3>1,245</h3>
    </div>
    <div>
      <p>Volume</p>
      <h3>$12.3K</h3>
    </div>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
